
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>AR 3D 探索教室</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 15px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      background: rgba(0, 54, 88, 0.88);
      color: white;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      z-index: 1000;
      pointer-events: none;
    }

    #status {
      margin-top: 7px;
      font-size: 14px;
    }

    #controls {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      background: white;
      color: #07577a;
    }
  </style>

  <script>
    AFRAME.registerComponent("model-setup", {
      init: function () {
        const entity = this.el;

        entity.addEventListener("model-loaded", function () {
          const obj = entity.getObject3D("mesh");
          if (!obj) return;

          const THREE = AFRAME.THREE;

          const bounds = new THREE.Box3()
            .setFromObject(obj);

          if (bounds.isEmpty()) return;

          const size = bounds.getSize(
            new THREE.Vector3()
          );

          const center = bounds.getCenter(
            new THREE.Vector3()
          );

          const maxSize = Math.max(
            size.x, size.y, size.z
          );

          if (maxSize <= 0) return;

          const factor = 0.8 / maxSize;

          // 讓模型中心對準 AR 圖卡
          obj.position.sub(center);
          obj.scale.multiplyScalar(factor);

          // 將模型底部放在標記平面附近
          obj.position.y += size.y / 2;

          document.getElementById("status")
            .textContent =
            "模型已載入，請對準 AR 圖卡";
        });

        entity.addEventListener("model-error", function () {
          document.getElementById("status")
            .textContent =
            "模型載入失敗，請確認 GLB 檔案";
        });
      }
    });
  </script>
</head>

<body>

  <div id="info">
    <strong>🌊 AR 3D 探索教室</strong>
    <div id="status">
      請將手機鏡頭對準 Hiro AR 圖卡
    </div>
  </div>

  <div id="controls">
    <button onclick="resizeModel(0.8)">
      － 縮小
    </button>

    <button onclick="resizeModel(1.25)">
      ＋ 放大
    </button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam;
          debugUIEnabled: false;">

    <a-assets>
      <a-asset-item
        id="glbModel"
        src="./model.glb">
      </a-asset-item>
    </a-assets>

    <a-marker
      id="marker"
      preset="hiro"
      emitevents="true">

      <a-entity
        id="myModel"
        gltf-model="#glbModel"
        model-setup
        position="0 0 0"
        scale="1 1 1">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    let modelScale = 1;

    function resizeModel(factor) {
      modelScale *= factor;

      modelScale = Math.max(
        0.2, Math.min(4, modelScale)
      );

      document.getElementById("myModel")
        .setAttribute(
          "scale",
          `${modelScale} ${modelScale} ${modelScale}`
        );
    }

    const marker = document.getElementById("marker");
    const status = document.getElementById("status");

    marker.addEventListener("markerFound", () => {
      status.textContent =
        "辨識成功！請移動手機觀察模型";
    });

    marker.addEventListener("markerLost", () => {
      status.textContent =
        "找不到圖卡，請重新對準";
    });
  </script>

</body>
</html>
